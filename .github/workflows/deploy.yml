name: Deploy to Production

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/stem

            # Production сервері енді дұрыс GitHub репозиторийден код алады
            git remote set-url origin https://github.com/stemcenterastana-stack/STEM_Shop.git

            # 1. Скачиваем свежие коммиты в кэш git, ничего не меняя на диске сервера
            git fetch origin master

            # 2. Вытаскиваем из гита ТОЛЬКО папки с кодом.
            # Твой рабочий docker-compose.yml и файлы базы на сервере никто не тронет.
            git checkout origin/master -- backend-stem/
            git checkout origin/master -- frontend-stem/

            # 3. Пересобираем фронтенд без кэша, чтобы пробить старые слои
            docker compose build --no-cache frontend
            docker compose build backend

            # 4. Обновляем контейнеры кода. База данных и редис продолжают работать без остановок.
            docker compose up -d --no-deps --remove-orphans frontend backend

            # 5. Чистим мусорные слои образов
            docker image prune -f